<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phân loại rác - EcoAI</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

<header>
  <nav class="nav">
    <a href="index.html" class="logo">♻ Eco<span>AI</span></a>
    <div class="nav-links">
      <a href="index.html">Trang chủ</a>
      <a href="classify.html" class="active">Phân loại AI</a>
      <a href="history.html">Lịch sử</a>
      <a href="about.html">Giới thiệu</a>
      <a href="guide.html">Hướng dẫn</a>
    </div>
  </nav>
</header>

<main class="container">
  <div class="page-heading">
    <span class="eyebrow">ECOAI CLASSIFICATION</span>
    <h1>Phân loại rác thải</h1>
    <p>Tải hình ảnh hoặc sử dụng camera để đưa ảnh vào hệ thống.</p>
  </div>

  <section class="panel">
    <h2>📷 Hình ảnh đầu vào</h2>

    <div class="upload-box">
      <div style="font-size:45px">🖼️</div>
      <h3>Chọn hình ảnh của bạn</h3>
      <p>Hỗ trợ hình ảnh JPG, PNG, WEBP</p>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <img id="preview" class="preview" alt="Ảnh xem trước">
    </div>

    <div class="actions">
      <button class="btn btn-outline" id="cameraButton">
        Mở camera
      </button>

      <button class="btn btn-outline" id="captureButton">
        Chụp ảnh
      </button>

      <button class="btn" id="classifyButton">
        ♻ Phân loại
      </button>
    </div>

    <video
      id="cameraVideo"
      autoplay
      playsinline
      style="display:none;width:100%;max-height:300px;margin-top:20px;border-radius:15px">
    </video>

    <div id="result" class="result"></div>
  </section>
</main>

<footer>EcoAI – Phân loại rác thông minh</footer>

</body>
</html>
